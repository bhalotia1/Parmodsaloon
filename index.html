<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parmod Saloon Radio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Georgia, "Times New Roman", serif;
    color:white;
    background:#090504;
    overflow:hidden;
}

/* AESTHETIC BARBER BACKGROUND */
.background{
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(
            rgba(8,3,2,.48),
            rgba(8,3,2,.82)
        ),
        url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1400&q=90");

    background-size:cover;
    background-position:center;
    filter:saturate(.85);
    transform:scale(1.03);
}

/* DARK CINEMATIC OVERLAY */
.background::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 10%,
            rgba(0,0,0,.25) 45%,
            rgba(0,0,0,.75) 100%
        );
}

/* MAIN */
.container{
    position:relative;
    z-index:2;

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

/* CONTENT */
.content{
    width:100%;
    max-width:430px;
    text-align:center;
}

/* BRAND */
.brand{
    font-size:12px;
    letter-spacing:6px;
    color:#e4b45d;
    margin-bottom:22px;
}

/* TITLE */
h1{
    font-size:42px;
    line-height:1;
    letter-spacing:2px;
    text-shadow:0 5px 30px rgba(0,0,0,.8);
}

.subtitle{
    margin-top:12px;
    color:#ddd0c7;
    font-size:14px;
    letter-spacing:1px;
}

/* PLAYER */
.player{
    margin-top:30px;

    padding:26px 20px;

    border-radius:25px;

    background:rgba(20,9,6,.78);

    border:1px solid rgba(228,180,93,.35);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.08);
}

/* MUSIC ICON */
.music-icon{
    width:72px;
    height:72px;

    margin:0 auto 18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #d9a441,
        #80551f
    );

    color:#180d07;

    font-size:30px;

    box-shadow:
        0 0 35px rgba(217,164,65,.25);
}

/* SONG */
.now{
    font-size:10px;
    letter-spacing:3px;
    color:#d9a441;
    margin-bottom:8px;
}

.song{
    font-size:19px;
    margin-bottom:20px;
}

/* YOUTUBE PLAYER */
.youtube{
    width:100%;
    height:0;
    padding-bottom:56.25%;

    position:relative;

    overflow:hidden;
    border-radius:15px;

    margin-top:10px;

    background:#000;
}

.youtube iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:0;
}

/* FOOTER */
.footer{
    margin-top:22px;

    font-size:10px;
    letter-spacing:3px;

    color:rgba(255,255,255,.55);
}

/* MOBILE */
@media(max-width:480px){

    .content{
        max-width:380px;
    }

    h1{
        font-size:38px;
    }

    .player{
        padding:22px 16px;
    }

    .brand{
        margin-bottom:18px;
    }
}
</style>
</head>

<body>

<!-- BARBER BACKGROUND -->
<div class="background"></div>

<div class="container">

    <div class="content">

        <div class="brand">
            PARMOD SALOON
        </div>

        <h1>
            90s Hindi<br>
            Radio
        </h1>

        <div class="subtitle">
            Classic songs • Classic vibes
        </div>

        <div class="player">

            <div class="music-icon">
                ♪
            </div>

            <div class="now">
                NOW PLAYING
            </div>

            <div class="song">
                90s Hindi Romantic Collection
            </div>

            <!-- YOUTUBE PLAYER -->
            <div class="youtube">

                <iframe
                    src="https://www.youtube.com/embed/xp5j2IHyTgs?rel=0"
                    title="90s Hindi Music"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

        <div class="footer">
            PARMOD SALOON • HASIMARA
        </div>

    </div>

</div>

</body>
</html>
