<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parmod Saloon — 90s Radio</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  background:#080706;
}


/* =========================
   REAL BARBER PHOTO
========================= */

.background{
  position:fixed;
  inset:0;

  z-index:0;

  background-image:
    linear-gradient(
      180deg,
      rgba(0,0,0,.38) 0%,
      rgba(0,0,0,.62) 45%,
      rgba(0,0,0,.92) 100%
    ),
    url("IMG_0140.jpeg");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  transform:scale(1.02);
}


/* cinematic warm glow */

.background::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(218,166,76,.16),
      transparent 35%
    );

  pointer-events:none;
}


/* =========================
   PAGE
========================= */

.page{
  position:relative;

  z-index:2;

  width:100%;

  max-width:620px;

  min-height:100vh;

  margin:auto;

  padding:
    24px
    18px
    45px;

  text-align:center;
}


/* =========================
   TOP BRAND
========================= */

.brand{
  display:inline-flex;

  align-items:center;

  gap:10px;

  padding:
    8px
    16px;

  border:
    1px solid
    rgba(232,184,91,.45);

  border-radius:50px;

  background:
    rgba(10,7,5,.38);

  backdrop-filter:blur(12px);

  color:#e7b95f;

  font-family:
    Arial,
    sans-serif;

  font-size:10px;

  letter-spacing:4px;

  font-weight:600;
}


/* =========================
   HERO
========================= */

.hero{
  padding:
    55px
    0
    30px;
}

.scissors{
  font-size:38px;

  margin-bottom:20px;

  color:#e7b95f;

  text-shadow:
    0 5px 25px rgba(0,0,0,.8);
}

h1{
  font-size:44px;

  line-height:.92;

  letter-spacing:3px;

  text-transform:uppercase;

  text-shadow:
    0 8px 35px rgba(0,0,0,.9);
}

.tagline{
  margin-top:17px;

  color:#ddd0c5;

  font-family:
    Arial,
    sans-serif;

  font-size:12px;

  letter-spacing:1.5px;

  text-shadow:
    0 3px 15px #000;
}


/* =========================
   PLAYER CARD
========================= */

.player{

  position:relative;

  margin-top:10px;

  padding:
    25px
    18px
    22px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(25,18,13,.78),
      rgba(5,5,4,.88)
    );

  border:
    1px solid
    rgba(232,184,91,.35);

  box-shadow:

    0 30px 80px
    rgba(0,0,0,.65),

    inset 0 1px
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(18px);
}


/* top shine */

.player::before{

  content:"";

  position:absolute;

  top:0;
  left:10%;

  width:80%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,220,150,.55),
      transparent
    );
}


/* =========================
   LIVE BADGE
========================= */

.live{

  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:
    7px
    13px;

  border-radius:30px;

  border:
    1px solid
    rgba(232,184,91,.35);

  background:
    rgba(0,0,0,.25);

  color:#e7b95f;

  font-family:Arial,sans-serif;

  font-size:9px;

  letter-spacing:2px;

  text-transform:uppercase;
}

.live-dot{

  width:6px;
  height:6px;

  border-radius:50%;

  background:#e15c42;

  box-shadow:
    0 0 12px #e15c42;

  animation:
    pulse 1.6s infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.45;
    transform:scale(.7);
  }

}


/* =========================
   VINYL
========================= */

.record{

  width:150px;
  height:150px;

  margin:
    27px
    auto
    24px;

  border-radius:50%;

  background:

    repeating-radial-gradient(
      circle,
      #050505 0px,
      #181818 2px,
      #050505 4px
    );

  border:
    7px solid
    rgba(12,10,8,.95);

  box-shadow:

    0 18px 45px
    rgba(0,0,0,.8),

    0 0 35px
    rgba(232,184,91,.12);

  display:flex;

  align-items:center;

  justify-content:center;
}


/* vinyl highlight */

.record::after{

  content:"";

  position:absolute;

  width:150px;
  height:150px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      transparent 30%
    );

  pointer-events:none;
}


.record-center{

  width:54px;
  height:54px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      #e7b95f 0 10%,
      #713e25 11% 54%,
      #160b07 55%
    );

  border:
    3px solid
    #bd813c;

  box-shadow:
    0 0 15px
    rgba(232,184,91,.18);
}


/* spinning */

.playing{

  animation:
    spin 5s linear infinite;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   SONG INFORMATION
========================= */

.now{

  color:#e7b95f;

  font-family:
    Arial,
    sans-serif;

  font-size:9px;

  letter-spacing:3px;

  text-transform:uppercase;
}

.song{

  margin-top:10px;

  font-size:20px;

  line-height:1.3;
}

.artist{

  margin-top:6px;

  color:#aa988d;

  font-family:Arial,sans-serif;

  font-size:12px;
}


/* =========================
   YOUTUBE EMBED
========================= */

.video-container{

  display:none;

  width:100%;

  margin-top:20px;

  overflow:hidden;

  border-radius:18px;

  background:#000;

  border:
    1px solid
    rgba(232,184,91,.32);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.55);
}

.video-container.show{

  display:block;

  animation:
    fadeIn .35s ease;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.video-container iframe{

  display:block;

  width:100%;

  aspect-ratio:16 / 9;

  border:0;
}


/* =========================
   CONTROLS
========================= */

.controls{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:28px;

  margin-top:22px;
}

.control{

  width:42px;
  height:42px;

  border:0;

  background:transparent;

  color:#cbb9ae;

  font-size:21px;

  cursor:pointer;

  transition:.2s;
}

.control:active{

  transform:scale(.85);
}

.play-button{

  width:68px;
  height:68px;

  border:0;

  border-radius:50%;

  background:

    linear-gradient(
      145deg,
      #f0c873,
      #b8752e
    );

  color:#170d08;

  font-size:25px;

  cursor:pointer;

  box-shadow:

    0 10px 35px
    rgba(0,0,0,.55),

    0 0 30px
    rgba(232,184,91,.16);

  transition:
    transform .2s,
    box-shadow .2s;
}

.play-button:active{

  transform:scale(.91);

}


/* =========================
   PLAYLIST
========================= */

.section-title{

  margin:
    34px
    0
    14px;

  color:#e7b95f;

  font-family:
    Arial,
    sans-serif;

  font-size:9px;

  font-weight:600;

  letter-spacing:3px;

  text-transform:uppercase;
}

.playlist{

  display:grid;

  gap:9px;
}

.playlist button{

  width:100%;

  padding:
    16px
    17px;

  border-radius:15px;

  border:
    1px solid
    rgba(232,184,91,.17);

  background:
    rgba(9,7,5,.63);

  color:#e0d3c9;

  font-family:Georgia,serif;

  font-size:13px;

  text-align:left;

  cursor:pointer;

  backdrop-filter:
    blur(10px);

  transition:
    .25s;
}

.playlist button:active{

  transform:scale(.98);

}

.playlist button:hover{

  border-color:
    rgba(232,184,91,.6);

  background:
    rgba(40,25,16,.75);

  color:#e7b95f;
}

.playlist span{

  float:right;

  color:#806c60;

  font-family:Arial,sans-serif;

  font-size:9px;

  letter-spacing:1px;
}


/* =========================
   FOOTER
========================= */

.footer{

  margin-top:30px;

  color:#77665d;

  font-family:Arial,sans-serif;

  font-size:8px;

  letter-spacing:2.5px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .page{

    padding-left:14px;
    padding-right:14px;

  }

  .hero{

    padding-top:43px;

  }

  h1{

    font-size:35px;

  }

  .record{

    width:132px;
    height:132px;

  }

  .record::after{

    width:132px;
    height:132px;

  }

  .controls{

    gap:19px;

  }

}

</style>
</head>


<body>


<!-- REAL BARBER SHOP IMAGE -->

<div class="background"></div>


<div class="page">


  <!-- BRAND -->

  <div class="brand">

    ✦ &nbsp; PARMOD SALOON &nbsp; ✦

  </div>


  <!-- HERO -->

  <section class="hero">

    <div class="scissors">
      ✂
    </div>

    <h1>

      90s Hindi<br>
      Radio

    </h1>

    <p class="tagline">

      Classic songs • Barber vibes • Good times

    </p>

  </section>


  <!-- MUSIC PLAYER -->

  <div class="player">


    <div class="live">

      <span class="live-dot"></span>

      Radio Online

    </div>


    <!-- VINYL -->

    <div
      class="record"
      id="record">

      <div class="record-center"></div>

    </div>


    <!-- SONG -->

    <div class="now">

      Now Playing

    </div>


    <div class="song">

      90s Hindi Romantic Collection

    </div>


    <div class="artist">

      Kumar Sanu Special

    </div>


    <!-- YOUTUBE PLAYER -->

    <div
      class="video-container"
      id="videoContainer">

      <iframe
        id="youtubePlayer"

        title="Parmod Saloon Radio"

        allow="
          autoplay;
          encrypted-media;
          picture-in-picture;
          fullscreen
        "

        allowfullscreen>

      </iframe>

    </div>


    <!-- CONTROLS -->

    <div class="controls">


      <button
        class="control"
        onclick="rewindVideo()">

        ↶

      </button>


      <button
        class="play-button"
        id="playButton"
        onclick="playMusic()">

        ▶

      </button>


      <button
        class="control"
        onclick="forwardVideo()">

        ↷

      </button>


    </div>

  </div>


  <!-- VIBES -->

  <div class="section-title">

    Select Your Vibe

  </div>


  <div class="playlist">


    <button
      onclick="changeSong('xp5j2IHyTgs')">

      🎵 &nbsp; Highway Raat

      <span>
        90s
      </span>

    </button>


    <button
      onclick="changeSong('xp5j2IHyTgs')">

      🎶 &nbsp; Saloon Classics

      <span>
        HITS
      </span>

    </button>


    <button
      onclick="changeSong('xp5j2IHyTgs')">

      💔 &nbsp; 90s Dard

      <span>
        LOVE
      </span>

    </button>


    <button
      onclick="changeSong('xp5j2IHyTgs')">

      💃 &nbsp; Shaadi & Sunday

      <span>
        FUN
      </span>

    </button>


  </div>


  <!-- FOOTER -->

  <div class="footer">

    PARMOD SALOON
    &nbsp;•&nbsp;
    90s MUSIC
    &nbsp;•&nbsp;
    HASIMARA

  </div>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const videoContainer =
  document.getElementById(
    "videoContainer"
  );

const youtubePlayer =
  document.getElementById(
    "youtubePlayer"
  );

const record =
  document.getElementById(
    "record"
  );

const playButton =
  document.getElementById(
    "playButton"
  );


let playing = false;


/* =========================
   PLAY / PAUSE
========================= */

function playMusic(){

  const videoID =
    "xp5j2IHyTgs";


  if(!playing){

    videoContainer.classList.add(
      "show"
    );


    youtubePlayer.src =
      "https://www.youtube.com/embed/"
      + videoID
      + "?autoplay=1&rel=0";


    record.classList.add(
      "playing"
    );


    playButton.innerHTML =
      "Ⅱ";


    playing = true;


  }else{


    youtubePlayer.src = "";


    videoContainer.classList.remove(
      "show"
    );


    record.classList.remove(
      "playing"
    );


    playButton.innerHTML =
      "▶";


    playing = false;

  }

}


/* =========================
   CHANGE SONG
========================= */

function changeSong(videoID){

  videoContainer.classList.add(
    "show"
  );


  youtubePlayer.src =
    "https://www.youtube.com/embed/"
    + videoID
    + "?autoplay=1&rel=0";


  record.classList.add(
    "playing"
  );


  playButton.innerHTML =
    "Ⅱ";


  playing = true;

}


/* =========================
   REWIND / FORWARD
========================= */

function rewindVideo(){

  /*
    YouTube controls are available
    inside the embedded player.
  */

  document
    .getElementById("youtubePlayer")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}


function forwardVideo(){

  document
    .getElementById("youtubePlayer")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}

</script>

</body>
</html>
