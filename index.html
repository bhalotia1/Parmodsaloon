<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parmod Saloon Radio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  color:#f5eadf;
  font-family:Georgia,"Times New Roman",serif;

  background:
    radial-gradient(circle at 50% 15%,rgba(157,91,42,.45),transparent 30%),
    radial-gradient(circle at 15% 80%,rgba(105,43,25,.35),transparent 30%),
    linear-gradient(135deg,#100807,#2b120c 48%,#080505);

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(circle at 50% 25%,
    rgba(255,196,100,.12),
    transparent 35%);
}

body::after{
  content:"";
  position:fixed;
  width:320px;
  height:320px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(207,133,55,.06);
  filter:blur(55px);
  pointer-events:none;
}

.page{
  position:relative;
  z-index:2;
  width:100%;
  max-width:600px;
  margin:auto;
  padding:25px 18px 35px;
  text-align:center;
}

.brand{
  font-size:12px;
  letter-spacing:5px;
  color:#d8a34a;
  margin-top:8px;
}

.hero{
  padding:45px 0 25px;
}

.scissors{
  font-size:52px;
  filter:drop-shadow(0 5px 15px rgba(0,0,0,.5));
  margin-bottom:18px;
}

h1{
  font-size:43px;
  line-height:.95;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 8px 30px rgba(0,0,0,.6);
}

.tagline{
  margin-top:15px;
  color:#bca99e;
  font-size:14px;
  letter-spacing:1px;
}

/* PLAYER */

.player{
  margin-top:20px;
  padding:25px 18px 22px;
  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(64,34,25,.92),
      rgba(14,8,7,.94)
    );

  border:1px solid rgba(207,145,70,.42);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.06);

  backdrop-filter:blur(15px);
}

.badge{
  display:inline-block;
  padding:7px 13px;
  border-radius:30px;
  border:1px solid #765033;
  color:#d8a34a;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* RECORD */

.record{
  width:155px;
  height:155px;
  margin:25px auto 22px;
  border-radius:50%;

  background:
    repeating-radial-gradient(
      circle,
      #090909 0px,
      #171717 2px,
      #050505 4px
    );

  border:7px solid #17110f;

  box-shadow:
    0 12px 35px rgba(0,0,0,.65),
    0 0 35px rgba(214,151,64,.08);

  display:flex;
  align-items:center;
  justify-content:center;
}

.record-center{
  width:55px;
  height:55px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #d8a34a 0 12%,
      #6b3822 13% 55%,
      #1b0d09 56%
    );

  border:3px solid #b67938;
}

.playing{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.now{
  color:#d8a34a;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.song{
  font-size:21px;
  margin-top:10px;
}

.artist{
  color:#a9958a;
  font-size:13px;
  margin-top:6px;
}

/* YOUTUBE PLAYER */

.video-container{
  display:none;
  width:100%;
  margin-top:20px;
  overflow:hidden;
  border-radius:16px;
  border:1px solid #60402e;
  background:#000;
}

.video-container.show{
  display:block;
}

.video-container iframe{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  border:0;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  margin-top:22px;
}

.control{
  border:none;
  background:transparent;
  color:#c9b7aa;
  font-size:21px;
  cursor:pointer;
}

.play-button{
  width:65px;
  height:65px;
  border:none;
  border-radius:50%;
  background:#d8a34a;
  color:#160b07;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(216,163,74,.25);
}

.play-button:active{
  transform:scale(.94);
}

/* PLAYLIST */

.section-title{
  margin:32px 0 14px;
  color:#d8a34a;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.playlist{
  display:grid;
  gap:10px;
}

.playlist button{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #493026;
  background:rgba(30,15,11,.75);
  color:#d7c7bc;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
}

.playlist button:hover{
  border-color:#d8a34a;
  color:#d8a34a;
}

.playlist span{
  float:right;
  color:#80695c;
}

/* FOOTER */

.footer{
  margin-top:30px;
  color:#66534b;
  font-size:10px;
  letter-spacing:2px;
}

@media(max-width:380px){

  h1{
    font-size:36px;
  }

  .record{
    width:135px;
    height:135px;
  }

  .controls{
    gap:18px;
  }
}
</style>
</head>


<body>

<div class="page">

  <div class="brand">
    PARMOD SALOON
  </div>


  <section class="hero">

    <div class="scissors">✂</div>

    <h1>
      90s Hindi<br>
      Radio
    </h1>

    <p class="tagline">
      Classic songs • Barber vibes • Good times
    </p>

  </section>


  <!-- MUSIC PLAYER -->

  <div class="player">

    <div class="badge">
      ● Radio Online
    </div>


    <div class="record" id="record">

      <div class="record-center"></div>

    </div>


    <div class="now">
      Now Playing
    </div>


    <div class="song">
      90s Hindi Romantic Collection
    </div>


    <div class="artist">
      Kumar Sanu Special
    </div>


    <!-- YOUTUBE EMBED -->

    <div
      class="video-container"
      id="videoContainer">

      <iframe
        id="youtubePlayer"
        src=""
        title="Parmod Saloon Music"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>


    <div class="controls">

      <button class="control">
        ↶
      </button>


      <button
        class="play-button"
        id="playButton"
        onclick="playMusic()">

        ▶

      </button>


      <button class="control">
        ↷
      </button>

    </div>

  </div>


  <!-- PLAYLIST -->

  <div class="section-title">
    Select Your Vibe
  </div>


  <div class="playlist">

    <button onclick="changeSong('xp5j2IHyTgs')">
      🎵 Highway Raat
      <span>90s</span>
    </button>


    <button onclick="changeSong('xp5j2IHyTgs')">
      🎶 Saloon Classics
      <span>Hits</span>
    </button>


    <button onclick="changeSong('xp5j2IHyTgs')">
      💔 90s Dard
      <span>Love</span>
    </button>


    <button onclick="changeSong('xp5j2IHyTgs')">
      💃 Shaadi & Sunday
      <span>Fun</span>
    </button>

  </div>


  <div class="footer">
    PARMOD SALOON • MUSIC • STYLE • VIBES
  </div>

</div>


<script>

const videoContainer =
  document.getElementById("videoContainer");

const youtubePlayer =
  document.getElementById("youtubePlayer");

const record =
  document.getElementById("record");

const playButton =
  document.getElementById("playButton");


function playMusic(){

  const videoID = "xp5j2IHyTgs";

  videoContainer.classList.add("show");

  youtubePlayer.src =
    "https://www.youtube.com/embed/" +
    videoID +
    "?autoplay=1&rel=0";

  record.classList.add("playing");

  playButton.innerHTML = "Ⅱ";

}


function changeSong(videoID){

  videoContainer.classList.add("show");

  youtubePlayer.src =
    "https://www.youtube.com/embed/" +
    videoID +
    "?autoplay=1&rel=0";

  record.classList.add("playing");

  playButton.innerHTML = "Ⅱ";

}

</script>

</body>
</html>
